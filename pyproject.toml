[project]
name = "cross-border-agent"
version = "0.1.0"
description = "LangGraph selection agent for the cross-border e-commerce workbench"
requires-python = ">=3.12,<3.14"
dependencies = [
    "langgraph>=1.0,<2.0",
    "langchain-core>=1.0,<2.0",
    "langchain>=1.0,<2.0",
    "pydantic>=2.7",
    "arcships-aimux==0.3.0",
    "aiohttp>=3.9",
    "python-dotenv>=1.0",
    "langfuse>=2.59",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "live: requires LLM_API_KEY env var; skipped if not set",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]